[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-opening-journal"
version = "1.0.0"
description = "Pure-stdlib CLI journal for your chess openings: log games from PGN with your own effort notes, summarize win/draw/loss per opening family, flag drift from your known lines only when you ask, and export a Markdown practice-focus card. No network, no accounts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["chess", "pgn", "openings", "journal", "cli", "practice", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Utilities",
]

[project.scripts]
chess-opening-journal = "chess_opening_journal.cli:main"

[tool.setuptools]
packages = ["chess_opening_journal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
